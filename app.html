<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fil</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <aside id="side">
    <div id="who">
      <button id="home-btn" type="button" class="backlink"><span data-icon="prev"></span><span id="home-label" data-i18n="home"></span></button>
      <h1 id="title">Fil</h1>
      <p id="span"></p>
      <div id="threads" class="chips" hidden></div>
    </div>
    <label id="searchbox">
      <span data-icon="search"></span>
      <input id="q" type="text" data-i18n-placeholder="searchPlaceholder" autocomplete="off" spellcheck="false">
      <button id="clear" type="button" data-i18n-aria-label="clearSearch" hidden><span data-icon="close"></span></button>
    </label>
    <nav id="tabs" class="segmented">
      <button type="button" data-view="fil"><span data-icon="bubble"></span><span data-i18n="tabFil" data-i18n-title="tabFil"></span></button>
      <button type="button" data-view="resumes"><span data-icon="doc"></span><span data-i18n="tabSummaries" data-i18n-title="tabSummaries"></span></button>
      <button type="button" data-view="frise"><span data-icon="frise"></span><span data-i18n="tabTimeline" data-i18n-title="tabTimeline"></span></button>
      <button type="button" data-view="analyse" class="icon-only" data-i18n-title="tabAnalysisTitle" data-i18n-aria-label="tabAnalysis"><span data-icon="chart"></span></button>
      <button type="button" data-view="favoris" class="icon-only" data-i18n-title="tabFavorites" data-i18n-aria-label="tabFavorites"><span data-icon="star"></span></button>
    </nav>
    <div id="filterbar" hidden></div>
    <ol id="timeline"></ol>
    <div id="batch" hidden></div>
    <footer>
      <button id="import" type="button" class="pill accent"><span data-icon="import"></span><span data-i18n="import"></span></button>
      <button id="backup" type="button" class="pill"><span data-icon="save"></span><span data-i18n="backup"></span></button>
      <button id="settings" type="button" class="pill round" data-i18n-title="settings" data-i18n-aria-label="settings"><span data-icon="sliders"></span></button>
    </footer>
  </aside>
  <main id="main">
    <div id="notice" hidden><p id="notice-text"></p><button id="notice-close" type="button" data-i18n-aria-label="close"><span data-icon="close"></span></button></div>
    <div id="view"></div>
  </main>
  <div id="filtercard" hidden></div>
  <div id="drop" hidden><p data-i18n="dropHere"></p></div>
  <input id="file" type="file" accept=".json,.txt,.zip,.csv,application/json,text/plain,application/zip" multiple hidden>
  <input id="folder" type="file" webkitdirectory multiple hidden>
  <div id="print"></div>
  <script src="i18n.js" defer></script>
  <script src="core.js" defer></script>
  <script src="storage.js" defer></script>
  <script src="import.js" defer></script>
  <script src="convs.js" defer></script>
  <script src="search-fold.js" defer></script>
  <script src="llm.js" defer></script>
  <script src="tags.js" defer></script>
  <script src="filters.js" defer></script>
  <script src="render.js" defer></script>
  <script src="ask.js" defer></script>
  <script src="frise.js" defer></script>
  <script src="settings.js" defer></script>
  <script src="transcript.js" defer></script>
  <script src="nav.js" defer></script>
  <script src="wiring.js" defer></script>
  <script src="cuts.js" defer></script>
  <script src="memory.js" defer></script>
  <script src="export.js" defer></script>
  <script src="stats.js" defer></script>
  <script src="platforms.js" defer></script>
  <script src="importers.js" defer></script>
  <script src="people.js" defer></script>
  <script src="home.js" defer></script>
  <script src="graph.js" defer></script>
  <script src="life.js" defer></script>
  <script src="start.js" defer></script>
</body>
</html>
